<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Offline · TMM Self Service</title>
    <style>
        :root { color-scheme: light; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f6; color: #212322;
               font-family: "Public Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
        .card { background: #fff; border: 1px solid #dce1e0; border-radius: 16px; padding: 32px 24px; max-width: 360px; }
        img { width: 56px; height: 56px; }
        h1 { font-size: 1.15rem; margin: 16px 0 8px; }
        p { color: #4a5250; margin: 0 0 4px; line-height: 1.5; }
        a { display: inline-block; margin-top: 20px; background: #0d827a; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <img src="../img/tmm-logo-dark.svg" alt="TMM" />
        <h1>You are offline</h1>
        <p>Connect to the internet to punch in, see your attendance or apply for leave.</p>
        <p dir="rtl" lang="ar">أنت غير متصل. اتصل بالإنترنت لتسجيل البصمة أو متابعة الحضور أو طلب إجازة.</p>
        <a href="./">Try again · حاول مرة أخرى</a>
    </div>
</body>
</html>
